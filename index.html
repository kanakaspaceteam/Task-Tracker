<style>
:root{--gold:#f6d143;--orange:#fcb45f;--coral:#ff8078;--coral-deep:#f16a62;--peach:#ffd9cc;--bg:#fff;--cream:#fffaf4;--surface:#fff;--ink:#211710;--soft:#4a3c32;--line:rgba(33,23,16,.12);--badge:#7a3f2a;--ok:#2f9e66;--late:#d6453d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1210;--cream:#241a16;--surface:#2a1f1a;--ink:#fff4ea;--soft:#d2bfb2;--line:rgba(255,244,234,.15);--peach:#4a2c25;--badge:#ffd9cc;--ok:#52c68a;--late:#ff7a70}}
:root[data-theme="dark"]{--bg:#1a1210;--cream:#241a16;--surface:#2a1f1a;--ink:#fff4ea;--soft:#d2bfb2;--line:rgba(255,244,234,.15);--peach:#4a2c25;--badge:#ffd9cc;--ok:#52c68a;--late:#ff7a70}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light dark}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:22px 18px 60px}
h1,h2{font-family:'Patrick Hand SC',cursive;font-weight:400;margin:0;letter-spacing:.3px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.top h1{font-size:32px}
.btn{border:none;border-radius:100px;padding:11px 20px;font:600 14.5px 'Plus Jakarta Sans',sans-serif;cursor:pointer;background:var(--coral);color:#211710;transition:background .15s,transform .15s}
.btn:hover{background:var(--coral-deep);transform:translateY(-1px)}
.btn.ghost{background:transparent;border:1.5px solid var(--coral);color:var(--ink)}
.btn.ghost:hover{background:var(--peach)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px}
.prog-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.big{font-family:'Patrick Hand SC',cursive;font-size:44px;line-height:1}
.big small{font-size:22px;color:var(--soft)}
.msg{font-weight:600;font-size:14.5px;color:var(--soft)}
.bar{height:16px;border-radius:100px;background:var(--peach);overflow:hidden;margin:14px 0 16px}
.bar i{display:block;height:100%;width:0;border-radius:100px;background:linear-gradient(90deg,var(--gold),var(--orange) 50%,var(--coral));transition:width .5s ease}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--cream);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{font-size:11.5px;color:var(--soft);font-weight:600}
.stat.warn b{color:var(--late)}
#formBox{display:none;margin-top:16px}
#formBox.open{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--soft);margin-bottom:4px}
input[type=text],input[type=date],input[type=number],input[type=email],input[type=password],select,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:500 15px 'Plus Jakarta Sans',sans-serif}
textarea{resize:vertical;min-height:84px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--coral)}
input:disabled{opacity:.45}
.ups{display:flex;gap:8px;flex-wrap:wrap}
.chk{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:100px;border:1.5px solid var(--line);cursor:pointer;font-size:13.5px;font-weight:600;user-select:none}
.chk.mini{padding:5px 10px;font-size:12px;margin-top:8px}
.chk input{accent-color:var(--coral);width:16px;height:16px;margin:0}
.chk:has(input:checked){border-color:var(--coral);background:var(--peach)}
.form-actions{display:flex;gap:10px;margin-top:16px;align-items:center;flex-wrap:wrap}
.form-actions .tot{margin-left:auto;font-weight:800;font-size:18px}
.filters{display:flex;gap:8px;margin:22px 0 12px;flex-wrap:wrap}
.fl{padding:8px 16px;border-radius:100px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:600 13.5px 'Plus Jakarta Sans',sans-serif;cursor:pointer}
.fl.on{background:var(--coral);border-color:var(--coral);color:#211710}
.fl[data-f="0"].on{background:var(--gold);border-color:var(--gold)}
.fl[data-f="1"].on{background:var(--orange);border-color:var(--orange)}
.fl[data-f="2"].on{background:#7dcf9a;border-color:#7dcf9a}
.order{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--orange);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.order.s0{border-left-color:var(--gold)}
.order.s1{border-left-color:var(--orange)}
.order.s2{border-left-color:#7dcf9a}
.order.late{border-left-color:var(--late)}
.ob{flex:1;min-width:0}
.oid{font-weight:800;font-size:13px;letter-spacing:.5px;color:var(--coral-deep)}
.oid span{color:var(--soft);font-weight:600;letter-spacing:0;margin-left:8px}
.nm{font-weight:700;font-size:16px;word-break:break-word}
.sv{font-size:13.5px;color:var(--soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:6px;background:var(--peach);color:var(--badge);white-space:nowrap}
.chip.late{background:var(--late);color:#fff}
.chip.today{background:var(--coral);color:#211710}
.steps{display:flex;gap:6px;margin-top:10px}
.st{flex:1;padding:8px 4px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--soft);font:700 12px 'Plus Jakarta Sans',sans-serif;cursor:pointer}
.st.past{background:var(--peach);border-color:var(--peach);color:var(--badge)}
.st[data-s="0"]{--sc:var(--gold)}
.st[data-s="1"]{--sc:var(--orange)}
.st[data-s="2"]{--sc:#7dcf9a}
.st.cur{background:var(--sc);border-color:var(--sc);color:#211710}
.right{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.rcb{border:1.5px solid var(--coral);background:transparent;color:var(--ink);font:700 12px 'Plus Jakarta Sans',sans-serif;padding:6px 12px;border-radius:100px;cursor:pointer}
.rcb:hover{background:var(--peach)}
.del{border:none;background:none;color:var(--soft);font:600 12px 'Plus Jakarta Sans',sans-serif;cursor:pointer;padding:4px 0}
.del.sure{color:var(--late)}
.note{white-space:pre-wrap;font-size:12.5px;color:var(--soft);margin-top:6px;font-style:italic}
.empty{text-align:center;color:var(--soft);padding:36px 10px;font-size:14.5px}
.ov{position:fixed;inset:0;background:rgba(33,23,16,.4);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);display:none;overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));z-index:50}
.ov.open{display:block}
.xbtn{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:16px;width:42px;height:42px;border-radius:50%;border:none;background:#fffaf4;color:#211710;font-size:20px;line-height:1;cursor:pointer;z-index:51;box-shadow:0 4px 14px rgba(33,23,16,.25)}
.xbtn:hover{background:#ffd9cc}
.rcard{max-width:380px;margin:0 auto;background:#fffaf4;color:#211710;border-radius:24px;overflow:hidden}
.rhead{background:#ff8078;padding:22px 22px 18px;text-align:center}
.rhead h2{font-size:34px;color:#211710}
.rhead p{margin:2px 0 0;font-size:13px;font-weight:600}
.rbody{padding:20px 22px 22px}
.rid{text-align:center;margin-bottom:12px}
.rid small{display:block;font-size:11.5px;font-weight:700;color:#4a3c32}
.rid b{font-size:24px;font-weight:800;letter-spacing:1.5px}
.rrow{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px dashed rgba(33,23,16,.18);font-size:14px}
.rrow span:first-child{color:#4a3c32}
.rrow b{white-space:pre-wrap;word-break:break-word;min-width:0;text-align:right;font-weight:700}
.rtot{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding:14px 16px;background:#ffd9cc;border-radius:14px}
.rtot span{font-weight:700;font-size:14px}
.rtot b{font-size:24px;font-weight:800}
.rfoot{margin:14px 0 0;text-align:center;font-size:12px;color:#4a3c32}
.ov-actions{max-width:380px;margin:14px auto 0;text-align:center;color:#fff;font-size:12.5px}
.ov-actions .btn{margin-top:10px}
@media(max-width:560px){.grid{grid-template-columns:1fr}.stats{gap:6px}.big{font-size:38px}.order{padding:12px}.top h1{font-size:26px}}

.wrap{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
input[type=text],input[type=date],input[type=number],input[type=email],input[type=password],select,textarea{font-size:16px;min-height:46px}

textarea{min-height:84px}

.btn:disabled{opacity:.6}

}

<body>
<div class="wrap">
  <div class="top"><h1>Kanaka Space Task Tracker</h1><button class="btn" id="addBtn">+ Order Baru</button></div>

  <div class="card">
    <div class="prog-top"><div class="big" id="bigNum">0<small>/0 terkirim</small></div><div class="msg" id="msg"></div></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="stats">
      <div class="stat"><b id="s0">0</b><span>Pembayaran</span></div>
      <div class="stat"><b id="s1">0</b><span>Diproses</span></div>
      <div class="stat"><b id="s2">0</b><span>Terkirim</span></div>
      <div class="stat warn"><b id="sTelat">0</b><span>Telat</span></div>
    </div>
  </div>

  <div class="card" id="formBox">
    <div class="ebar" id="eBar" hidden></div>
    <div class="grid">
      <div class="full" id="idSegW"><label class="f">Identitas klien</label><div class="seg" id="idSeg"><button type="button" data-t="ph" class="on">No. HP</button><button type="button" data-t="un">Username</button></div></div>
      <div><label class="f" for="fPhone" id="lPhone">4 angka terakhir nomor HP klien</label><input type="text" id="fPhone" inputmode="numeric" maxlength="4" placeholder="Tambahkan 4 angka terakhir" autocomplete="off"></div>
      <div><label class="f" for="fSvc">Layanan</label><select id="fSvc"></select></div>
      
      <div class="full" id="wPkg"><label class="f" for="fPkg">Paket</label><select id="fPkg"></select></div>

  const s=curSvc();

function calc(){
  const s=curSvc(),base=s.other?(+$("fOtherPrice").value||0):s.opts[$("fPkg").value||0][1];
  let sum=base,quick=false;
  $("fUps").querySelectorAll("input:checked").forEach(c=>{const u=s.ups[c.dataset.i];sum+=u[1];if(u[2]==="quick")quick=true});
  const disc=Math.min(+$("fDisc").value||0,sum);
  return{s,base,sum,quick,disc,net:sum-disc};
}
function recalc(force){
  const {s,net,quick}=calc();

  if(!priceManual)$("fPrice").value=net;
  if(!dlManual||force===true){if(force===true)dlManual=false;$("fDl").value=addDays($("fOd").value||today(),quick?1:s.dl)}

}

function suggs(){
  const s=norm(q).trim().replace(/^[#@]/,"");if(!s)return[];
  const seen=new Set(),out=[];
  const add=(v,type,d)=>{if(!v)return;const k=type+"|"+norm(v);if(seen.has(k))return;const i=norm(v).indexOf(s);if(i<0)return;seen.add(k);out.push({v,type,d:d||v,r:i===0?0:1})};
  orders.forEach(o=>{add(o.id,"Order ID");add(o.svc,"Layanan");if(o.ph)o.idt==="un"?add(o.ph,"Username","@"+o.ph):add(o.ph,"No. HP","••••"+o.ph)});
  return out.sort((a,b)=>a.r-b.r||a.type.localeCompare(b.type)).slice(0,6);
}

  if(t.classList.contains("st")){
    const s=+t.dataset.s;
    if(s!==o.stage){
      o.times=o.times||{};
      for(let k=1;k<=2;k++)if(k>s)delete o.times[k];
      if(s>=1&&(s>o.stage||!o.times[s]))o.times[s]=Date.now();
      if(s===1&&o.stage===0){o.sub=0;o.subT={}}if(s===0){delete o.sub;delete o.subT}o.stage=s;o.sentAt=s===2?o.times[2]:null;save();render();
    }
  }
  else if(t.classList.contains("sb")){
    const u=+t.dataset.u,cu=o.sub||0;
    if(u!==cu){
      const T=o.subT||{};
      Object.keys(T).forEach(k=>{if(+k>u)delete T[k]});
      if(u===0||u>cu||!T[u])T[u]=Date.now();
      o.subT=T;o.sub=u;save();render();
    }
  }
  else if(t.classList.contains("stb"))showStatus(o.id);
  else if(t.classList.contains("edt"))openEdit(o.id);
  else if(t.classList.contains("rcb"))showReceipt(o.id);
  else if(t.classList.contains("del")){
    if(t.classList.contains("sure")){orders=orders.filter(x=>x!==o);save();render()}
    else{t.classList.add("sure");t.textContent="Yakin hapus?";setTimeout(()=>{t.classList.remove("sure");t.textContent="Hapus"},2500)}
  }
});

function fitReceipt(){const f=$("rfit"),c=document.querySelector("#ovIn .rcard");if(!f||!c)return;const w=c.offsetWidth;if(!w)return;const s=Math.min(1,(window.innerWidth-32)/w);f.style.width=w*s+"px";$("rscale").style.width=w+"px";$("rscale").style.transform=`scale(${s})`;f.style.height=c.offsetHeight*s+"px"}
window.addEventListener("resize",fitReceipt);
function showReceipt(id){
  const o=orders.find(x=>x.id===id);if(!o)return;
  const sum=o.base+o.ups.reduce((a,u)=>a+u.p,0),disc=o.tbd?0:(o.disc||0);
  const sv=SERVICES.find(x=>o.pkg==="Custom"?x.other:x.name===o.svc),hint=o.stage===0&&sv&&sv.dl>0&&!o.ups.some(u=>/^Quick Reading/.test(u.n))?`Hasil diproses ${sv.dl} hari. Untuk hasil kilat 24 jam tersedia di jalur Quick Reading.`:"";
  const rows=[`<div class="rrow"><span>${o.pkg==="Custom"?"Biaya layanan":esc(o.pkg)}</span><b>${o.tbd?"Menyusul":rp(o.base)}</b></div>`];
  o.ups.forEach(u=>rows.push(`<div class="rrow"><span>${esc(u.n)}</span><b>${rp(u.p)}</b></div>`));
  if(disc>0)rows.push(`<div class="rrow"><span>Potongan harga</span><b>${rp(-disc)}</b></div>`);
  if(!o.tbd&&o.price!==sum-disc)rows.push(`<div class="rrow"><span>Penyesuaian</span><b>${rp(o.price-(sum-disc))}</b></div>`);
  $("ovIn").innerHTML=`<button class="xbtn" id="ovX" aria-label="Tutup">✕</button><div id="rfit"><div id="rscale"><div class="rcard">
  <div class="rhead"><img class="rlogo" src="${LOGO_URL}" crossorigin="anonymous" alt="" onerror="this.onerror=null;if(logo)this.src=logo;else this.remove()"><div><h2>Kanaka Space</h2><p>Konfirmasi Pesanan &amp; Harga</p></div></div>
  <div class="rbody"><div class="rid"><small>ORDER ID</small><b>${o.id}</b></div>${statusHtml(o)}<div style="margin-bottom:10px">
  <div class="rrow"><span>Tanggal order</span><b>${fmtL(o.odate)}</b></div>
  ${o.title?`<div class="rrow"><span>Judul orderan</span><b>${esc(o.title)}</b></div>`:`<div class="rrow"><span>${o.idt==="un"?"Username":"No. HP"}</span><b>${o.idt==="un"?"@"+esc(o.ph):"••••"+o.ph}</b></div>`}
  <div class="rrow"><span>Layanan</span><b>${esc(o.pkg==="Custom"?"Other":o.svc)}</b></div>
  ${rows.join("")}
  <div class="rrow"${hint?` style="border-bottom:0;padding-bottom:0"`:""}><span>Estimasi hasil</span><b>${fmtL(o.dl)}</b></div>${hint?`<div class="rhint">${hint}</div>`:""}
  ${o.note?`<div class="rnote"><span>Catatan</span>${esc(o.note)}</div>`:""}</div>
  <div class="rtot"><span>Total</span><b>${o.tbd?"Menyusul":rp(o.price)}</b></div>
  <p class="rfoot">${o.stage>=1?"":"Mohon cek kembali detail pesanan sebelum melakukan pembayaran.<br>"}<b>@kanakaspace | +62878 2658 4334 | kanakaspace@gmail.com</b></p></div>
  </div></div></div>
  <div class="ov-actions">Simpan gambar kartu di atas untuk dikirim ke klien<br><button class="btn" id="ovSave">${SAVE_LABEL}</button></div>`;
  $("ov").classList.add("open");$("ov").scrollTop=0;document.body.style.overflow="hidden";
  fitReceipt();$("ovX").onclick=closeOv;$("ovSave").onclick=()=>saveImg(o);
}
function showStatus(id){
  const o=orders.find(x=>x.id===id);if(!o)return;
  $("ovIn").innerHTML=`<button class="xbtn" id="ovX" aria-label="Tutup">✕</button><div id="rfit"><div id="rscale"><div class="rcard sm">
  <div class="rhead"><img class="rlogo" src="${LOGO_URL}" crossorigin="anonymous" alt="" onerror="this.onerror=null;if(logo)this.src=logo;else this.remove()"><div><h2>Kanaka Space</h2><p>Status Pesanan</p></div></div>
  <div class="rbody"><div class="rid"><small>ORDER ID</small><b>${o.id}</b></div>${statusHtml(o,true)}</div>
  </div></div></div>
  <div class="ov-actions">Simpan gambar status di atas untuk dikirim ke klien<br><button class="btn" id="ovSave">${SAVE_LABEL}</button></div>`;
  $("ov").classList.add("open");$("ov").scrollTop=0;document.body.style.overflow="hidden";
  fitReceipt();$("ovX").onclick=closeOv;$("ovSave").onclick=()=>saveImg(o,"Status");
}
const STG=[{n:"Pembayaran",m:"Menunggu pembayaran",c:"#f6d143",r:"rgba(246,209,67,.38)",bg:"#fff4cf",tx:"#6b5300"},{n:"Diproses",m:"Pesanan sedang diproses",c:"#fcb45f",r:"rgba(252,180,95,.38)",bg:"#ffe9d0",tx:"#7a4410"},{n:"Terkirim",m:"Pesanan sudah terkirim",c:"#7dcf9a",r:"rgba(125,207,154,.4)",bg:"#e2f5e8",tx:"#1f5a38"}];
const SUBS=["Permintaan baru diproses","Menunggu antrian","Pesanan sedang dikerjakan"];
function subHtml(o){
  const u=o.sub||0,T=o.times||{},ST=o.subT||{};
  return `<div class="rsub"><div class="rsubt">TAHAP PROSES</div>${SUBS.map((n,i)=>{const t=i===0?T[1]:ST[i];return `<div class="rq ${i<=u?"on":""} ${i===u?"cur":""}"><i></i><div>${n}${i<=u&&t?`<em>${fmtT(t)}</em>`:""}</div></div>`}).join("")}</div>`;
}
function subBar(o){const u=o.sub||0;return `<div class="subs"><small>Tahap proses · jadi Antrian otomatis setelah 1 jam</small><div>${["Baru diproses","Antrian","Dikerjakan"].map((n,i)=>`<button class="sb ${i<u?"past":""} ${i===u?"cur":""}" data-u="${i}">${i<u?"✓ ":""}${n}</button>`).join("")}</div></div>`}
function autoSub(){let ch=false;orders.forEach(o=>{if(o.stage===1&&!o.sub){const t0=(o.subT&&o.subT[0])||(o.times&&o.times[1]);if(!t0||Date.now()-t0>=36e5){o.sub=1;o.subT=o.subT||{};o.subT[1]=t0?t0+36e5:Date.now();ch=true}}});if(ch)save()}
function statusHtml(o,sub){
  const s=o.stage,cur=STG[s],T=o.times||{};
  return `<div class="rstat" style="background:${cur.bg};color:${cur.tx}"><small>STATUS PESANAN</small><div class="rpill">${cur.m}</div><div class="rsteps">${STG.map((g,i)=>{const on=i<=s,tm=i>0&&on&&T[i]?fmtT(T[i]).replace(" · ","<br>"):"";return `<div class="rs ${on?"on":""} ${i===s?"cur":""}" style="--c:${g.c};--r:${g.r}"><i>${i<s||(s===2&&i===2)?"✓":i+1}</i>${g.n}${tm?`<em>${tm}</em>`:""}</div>`}).join("")}</div>${sub&&s===1?subHtml(o):""}</div>`;
}
function setLogo(f,id){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,320/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);logo=cv.toDataURL("image/png");try{localStorage.setItem(LOGO_KEY,logo)}catch(e){}showReceipt(id)};im.src=r.result};r.readAsDataURL(f)}
function closeOv(){$("ov").classList.remove("open");document.body.style.overflow=""}
function showImg(u){const c=$("rfit"),W=(document.querySelector("#ovIn .rcard")||{}).offsetWidth||360;if(c)c.outerHTML=`<img src="${u}" alt="Konfirmasi pesanan" style="display:block;width:100%;max-width:${W}px;margin:0 auto;border-radius:0"><p style="max-width:${W}px;margin:10px auto 0;text-align:center;color:#fff;font-size:12.5px">Tahan lama gambar, lalu pilih Simpan ke Foto.</p>`}
async function saveImg(o,tag){
  const b=$("ovSave"),card=document.querySelector("#ovIn .rcard");
  if(!card)return;
  b.disabled=true;b.textContent="Memproses...";
  try{
    const cv=await html2canvas(card,{scale:3,backgroundColor:null,useCORS:true,windowWidth:Math.max(innerWidth,800),onclone:d=>{const x=d.getElementById("rscale"),f=d.getElementById("rfit");if(x)x.style.transform="none";if(f){f.style.width=card.offsetWidth+"px";f.style.height="auto"}}});
    const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
    const name="Kanaka Space "+(tag?tag+" ":"")+o.id+".png";
    if(MOBILE&&window.File&&navigator.canShare&&navigator.share){
      try{const f=new File([blob],name,{type:"image/png"});if(navigator.canShare({files:[f]})){await navigator.share({files:[f]});b.textContent=SAVE_LABEL;b.disabled=false;return}}
      catch(e){if(e&&e.name==="AbortError"){b.textContent=SAVE_LABEL;b.disabled=false;return}}
    }
    let dl=null;try{dl=window.claude&&await window.claude.use("downloads")}catch(e){}
    if(dl){
      try{await dl.save({filename:name,data:blob})}
      catch(err){if(!(err&&err.code==="declined"))showImg(cv.toDataURL("image/png"))}
    }else{
      if(MOBILE)showImg(cv.toDataURL("image/png"));
      else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
    }
    b.textContent=SAVE_LABEL;
  }catch(e){b.textContent="Gagal, coba screenshot";setTimeout(()=>{b.textContent=SAVE_LABEL},2500)}
  b.disabled=false;
}
$("ov").addEventListener("click",e=>{if(e.target===$("ov"))closeOv()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeOv()});

function render(){
  autoSub();prune();
  const t=today(),total=orders.length,c=[0,1,2].map(i=>orders.filter(o=>o.stage===i).length);
  const pct=total?Math.round(c[2]/total*100):0;
  $("bigNum").innerHTML=`${c[2]}<small>/${total} terkirim</small>`;
  $("barFill").style.width=pct+"%";
  $("msg").textContent=!total?"Belum ada order. Tambah yang pertama!":pct===100?"Semua terkirim! Waktunya istirahat :)":pct>=70?"Udah banyak yang terkirim, dikit lagi!":pct>=40?"Lumayan, lanjut terus ya":"Masih banyak yang belum selesai";
  c.forEach((n,i)=>$("s"+i).textContent=n);
  $("sTelat").textContent=orders.filter(o=>o.stage<2&&diff(o.dl,t)<0).length;
  let rows=orders.filter(o=>(filter==="all"||o.stage===+filter)&&matchQ(o));
  rows.sort((a,b)=>(a.stage===2)-(b.stage===2)||(a.stage===2?b.sentAt-a.sentAt:a.dl.localeCompare(b.dl)));
  if(!rows.length){$("list").innerHTML=`<div class="empty">${total?(q.trim()?`Tidak ada order yang cocok dengan “${esc(q.trim())}”.`:"Tidak ada order di filter ini."):"Klik “+ Order Baru” buat mulai."}</div>`;return}
  const L=["Pembayaran","Diproses","Terkirim"];
  $("list").innerHTML=rows.map(o=>{
    const d=diff(o.dl,t),fin=o.stage===2;
    const k=fin?"done":d<0?"late":d===0?"today":"";
    const lbl=fin?`Terkirim · hapus ${Math.max(1,Math.ceil(30-(Date.now()-o.sentAt)/DAY))} hari lagi`:d<0?`Telat ${-d} hari · ${fmtD(o.dl)}`:d===0?"Deadline hari ini":d===1?`Besok · ${fmtD(o.dl)}`:`${d} hari lagi · ${fmtD(o.dl)}`;
    return `<div class="order ${k} s${o.stage}" data-id="${o.id}"><div class="ob">
      <div class="oid">#${o.id}${o.title?"":`<span>${esc(who(o))}</span>`}</div>
      <div class="nm">${esc(o.svc)}</div>
      <div class="sv">${esc(o.pkg)}${o.ups.length?" + "+esc(o.ups.map(u=>u.n).join(", ")):""}</div>
      <div class="chips"><span class="chip ${fin?"":k}">${lbl}</span><span class="chip">Order ${fmtD(o.odate)}</span><span class="chip">${o.tbd?"Harga menyusul":rp(o.price)}</span></div>
      <div class="steps">${L.map((n,i)=>`<button class="st ${i<o.stage?"past":""} ${i===o.stage?"cur":""} ${i===o.stage&&i===2?"last":""}" data-s="${i}">${i<o.stage?"✓ ":""}${n}</button>`).join("")}</div>
      ${o.stage===1?subBar(o):""}
      ${o.note?`<div class="note">${esc(o.note)}</div>`:""}</div>
      <div class="right"><div class="rbtns">${o.stage>=1?`<button class="rcb stb">Status</button>`:""}<button class="rcb">Rincian</button></div><div class="rlinks"><button class="edt">Edit</button><button class="del">Hapus</button></div></div></div>`;
  }).join("");
}
render();
setInterval(()=>{const b=orders.filter(o=>o.sub).length;autoSub();if(orders.filter(o=>o.sub).length!==b)render()},60000);

</script>
